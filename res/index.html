<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客 · 主页</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">

<!-- ===== 全局样式 ===== -->
<link rel="stylesheet" href="PageStyle/Global/variables.css">
<link rel="stylesheet" href="PageStyle/Global/reset.css">
<link rel="stylesheet" href="PageStyle/Global/layout.css">

<!-- ===== 各区域样式 ===== -->
<link rel="stylesheet" href="PageStyle/ProfileCard/profile.css">
<link rel="stylesheet" href="PageStyle/MusicPlayer/music.css">
<link rel="stylesheet" href="PageStyle/ArticleBlocks/blocks.css">
<link rel="stylesheet" href="PageStyle/SearchView/search.css">

<!-- ===== 响应式 ===== -->
<link rel="stylesheet" href="PageStyle/Global/responsive.css">
</head>
<body>

<!-- ===== 加载页面 ===== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-scene">
    <!-- 地面 -->
    <div class="ground">
      <div class="ground-line"></div>
    </div>
    <!-- 障碍物：仙人掌（Minecraft等距3D） -->
    <div class="obstacle">
      <svg viewBox="0 0 52 74" fill="none">
        <!-- 主体顶面 -->
        <polygon points="21,4 35,4 42,10 28,10" fill="#a5d6a7"/>
        <!-- 主体正面 -->
        <polygon points="28,10 42,10 42,64 28,64" fill="#66bb6a"/>
        <!-- 主体侧面 -->
        <polygon points="35,4 42,10 42,64 35,58" fill="#2e7d32"/>
        <!-- 左臂顶面 -->
        <polygon points="5,26 16,26 23,32 12,32" fill="#a5d6a7"/>
        <!-- 左臂正面 -->
        <polygon points="12,32 23,32 23,52 12,52" fill="#66bb6a"/>
        <!-- 左臂侧面 -->
        <polygon points="16,26 23,32 23,52 16,46" fill="#2e7d32"/>
        <!-- 右臂顶面 -->
        <polygon points="42,36 49,36 53,40 46,40" fill="#a5d6a7"/>
        <!-- 右臂正面 -->
        <polygon points="46,40 53,40 53,56 46,56" fill="#66bb6a"/>
        <!-- 右臂侧面 -->
        <polygon points="49,36 53,40 53,56 49,52" fill="#2e7d32"/>
        <!-- 刺 -->
        <rect x="31" y="20" width="2" height="2" fill="#1b5e20"/>
        <rect x="37" y="30" width="2" height="2" fill="#1b5e20"/>
        <rect x="32" y="42" width="2" height="2" fill="#1b5e20"/>
        <rect x="38" y="52" width="2" height="2" fill="#1b5e20"/>
        <rect x="15" y="40" width="2" height="2" fill="#1b5e20"/>
        <rect x="48" y="46" width="2" height="2" fill="#1b5e20"/>
      </svg>
    </div>
    <!-- Minecraft风格方块猫（等距3D增强版） -->
    <div class="cat">
      <svg viewBox="0 0 140 110" fill="none">
        <!-- 地面阴影 -->
        <ellipse cx="72" cy="102" rx="48" ry="5" fill="#000" opacity="0.12"/>
        <!-- 尾巴 -->
        <g class="cat-tail">
          <polygon points="16,62 8,30 18,28 26,60" fill="#ffa726"/>
          <polygon points="16,62 26,60 28,66 18,68" fill="#e65100"/>
          <polygon points="8,30 18,28 20,34 10,36" fill="#ffb74d"/>
        </g>
        <!-- 身体顶面 -->
        <polygon points="24,50 92,42 100,54 30,62" fill="#ffa726"/>
        <!-- 身体正面 -->
        <polygon points="30,62 100,54 100,76 30,82" fill="#fb8c00"/>
        <!-- 身体侧面 -->
        <polygon points="24,50 30,62 30,82 22,72" fill="#e65100"/>
        <!-- 虎斑花纹 -->
        <rect x="42" y="56" width="5" height="18" fill="#e65100" opacity="0.35"/>
        <rect x="58" y="54" width="5" height="20" fill="#e65100" opacity="0.35"/>
        <rect x="74" y="52" width="5" height="18" fill="#e65100" opacity="0.35"/>
        <!-- 头顶面 -->
        <polygon points="90,32 116,30 122,44 96,46" fill="#ffa726"/>
        <!-- 头正面 -->
        <polygon points="96,46 122,44 122,68 96,70" fill="#ffcc80"/>
        <!-- 头侧面 -->
        <polygon points="90,32 96,46 96,70 90,56" fill="#fb8c00"/>
        <!-- 耳朵 -->
        <polygon points="94,32 98,16 104,32" fill="#fb8c00"/>
        <polygon points="94,32 98,16 100,32" fill="#ffa726"/>
        <polygon points="106,30 110,14 116,30" fill="#fb8c00"/>
        <polygon points="106,30 110,14 112,30" fill="#ffa726"/>
        <!-- 耳朵内侧 -->
        <polygon points="97,28 99,20 101,28" fill="#f8bbd0"/>
        <polygon points="109,26 111,18 113,26" fill="#f8bbd0"/>
        <!-- 眼睛 -->
        <rect x="102" y="52" width="6" height="6" fill="#1a1a1a"/>
        <rect x="114" y="52" width="6" height="6" fill="#1a1a1a"/>
        <rect x="103" y="53" width="2" height="2" fill="#fff"/>
        <rect x="115" y="53" width="2" height="2" fill="#fff"/>
        <!-- 鼻子 -->
        <polygon points="120,60 124,62 120,64" fill="#ec407a"/>
        <!-- 嘴 -->
        <path d="M120,64 Q118,68 115,66" stroke="#bf360c" stroke-width="1.5" fill="none"/>
        <path d="M120,64 Q122,68 125,66" stroke="#bf360c" stroke-width="1.5" fill="none"/>
        <!-- 胡须 -->
        <line x1="122" y1="62" x2="134" y2="60" stroke="#bf360c" stroke-width="1"/>
        <line x1="122" y1="65" x2="134" y2="66" stroke="#bf360c" stroke-width="1"/>
        <!-- 腿 -->
        <rect class="leg leg-1" x="34" y="76" width="10" height="22" fill="#fb8c00"/>
        <rect class="leg leg-2" x="70" y="76" width="10" height="22" fill="#fb8c00"/>
        <rect class="leg leg-3" x="46" y="76" width="10" height="22" fill="#e65100"/>
        <rect class="leg leg-4" x="82" y="76" width="10" height="22" fill="#e65100"/>
        <!-- 脚掌 -->
        <rect class="paw paw-1" x="32" y="94" width="14" height="6" fill="#bf360c"/>
        <rect class="paw paw-2" x="68" y="94" width="14" height="6" fill="#bf360c"/>
        <rect class="paw paw-3" x="44" y="94" width="14" height="6" fill="#8d6e00"/>
        <rect class="paw paw-4" x="80" y="94" width="14" height="6" fill="#8d6e00"/>
      </svg>
    </div>
  </div>
  <div class="loading-tips">
    <span class="tip-text" id="loadingTip">首次加载较慢，请稍候...</span>
  </div>
</div>

<!-- 背景层 -->
<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="app">

  <!-- ==================== 主视图 ==================== -->
  <div class="main-view" id="mainView">

    <div class="top-row">
      <!-- 个人信息卡片 -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar">
            <img src="Resources/Avatar/avatar.jpg" alt="头像" id="avatarImg">
          </div>
          <div class="profile-info">
            <div class="profile-name">晚自习</div>
            <div class="profile-bio">一个普通人～</div>
          </div>
        </div>
        <!-- 底部按钮区：更多在左，设置/GitHub/文档在右 -->
        <div class="profile-footer">
          <button class="more-btn-inline" onclick="toggleSearch()" aria-label="更多">
            <span data-icon="more"></span>
            更多
          </button>
          <div class="profile-actions-right">
            <button class="action-btn" onclick="handleAction('settings')" title="设置" aria-label="设置">
              <span data-icon="settings"></span>
            </button>
            <button class="action-btn" onclick="handleAction('github')" title="GitHub 仓库" aria-label="GitHub 仓库">
              <span data-icon="github"></span>
            </button>
            <button class="action-btn" onclick="handleAction('docs')" title="开发文档" aria-label="开发文档">
              <span data-icon="docs"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- 音乐播放器（无左上角标签） -->
      <div class="music-card">
        <div class="music-header">
          <div class="music-cover" id="musicCover">
            <img src="" alt="专辑封面" id="musicCoverImg">
          </div>
          <div class="music-info">
            <div class="music-title" id="musicTitle">歌曲名称</div>
            <div class="music-artist" id="musicArtist">歌手</div>
          </div>
        </div>
        <div class="music-progress-wrap">
          <span id="musicCurrent">00:52</span>
          <div class="music-progress" id="musicProgress" onclick="seekMusic(event)">
            <div class="music-progress-bar" id="musicProgressBar"></div>
          </div>
          <span id="musicTotal">02:56</span>
        </div>
        <div class="music-controls">
          <button class="music-ctrl-btn" onclick="prevMusic()" aria-label="上一首">
            <span data-icon="prev"></span>
          </button>
          <button class="music-ctrl-btn music-play-btn" id="musicPlayBtn" onclick="togglePlay()" aria-label="播放/暂停">
            <svg id="musicPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="music-ctrl-btn" onclick="nextMusic()" aria-label="下一首">
            <span data-icon="next"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- 文章板块网格 -->
    <div class="articles-grid">
      <div class="article-block block-large" data-carousel="large">
        <div class="block-viewport">
          <div class="block-track"></div>
          <button class="block-page-btn prev" onclick="blockPrev('large')" aria-label="上一篇">&#10094;</button>
          <button class="block-page-btn next" onclick="blockNext('large')" aria-label="下一篇">&#10095;</button>
        </div>
        <div class="block-dots"></div>
      </div>

      <div class="article-block block-wide" data-carousel="wide">
        <div class="block-viewport">
          <div class="block-track"></div>
          <button class="block-page-btn prev" onclick="blockPrev('wide')" aria-label="上一篇">&#10094;</button>
          <button class="block-page-btn next" onclick="blockNext('wide')" aria-label="下一篇">&#10095;</button>
        </div>
        <div class="block-dots"></div>
      </div>

      <div class="article-block block-small" data-carousel="small">
        <div class="block-viewport">
          <div class="block-track"></div>
          <button class="block-page-btn prev" onclick="blockPrev('small')" aria-label="上一篇">&#10094;</button>
          <button class="block-page-btn next" onclick="blockNext('small')" aria-label="下一篇">&#10095;</button>
        </div>
        <div class="block-dots"></div>
      </div>
    </div>

  </div>

  <!-- ==================== 搜索视图 ==================== -->
  <div class="search-view" id="searchView">
    <div class="search-header">
      <button class="search-back-btn" onclick="toggleSearch()" aria-label="返回">
        <span data-icon="back"></span>
      </button>
      <div class="search-bar-wrap">
        <div class="search-bar">
          <span class="search-icon" data-icon="search"></span>
          <input type="text" id="searchInput" placeholder="搜寻标题、描述或标签..." oninput="renderTimeline()">
        </div>
      </div>
    </div>

    <div class="tag-scroll-wrap">
      <div class="tag-scroll" id="tagScroll"></div>
    </div>

    <div class="timeline-container">
      <div class="timeline-line"></div>
      <div id="timelineContent"></div>
    </div>
  </div>

</div>

<!-- ===== 主题（最先加载，避免闪烁） ===== -->
<script src="Scripts/theme.js"></script>

<!-- ===== 数据对象 ===== -->
<script src="Resources/Articles/articles.js"></script>
<script src="Resources/Music/playlist.js"></script>
<script src="Resources/Preview/preview.js"></script>
<script src="Resources/Tags/tags.js"></script>

<!-- ===== 功能脚本 ===== -->
<script src="Scripts/icon-loader.js"></script>
<script src="Scripts/carousel.js"></script>
<script src="Scripts/music.js"></script>
<script src="Scripts/search.js"></script>
<script src="Scripts/main.js"></script>

<!-- ===== Service Worker 注册（资源缓存） ===== -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('ServiceWorker 注册失败:', err);
    });
  });
}
</script>

</body>
</html>
